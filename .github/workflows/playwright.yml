name: Playwright Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'web-app/**'
      - 'tests/**'
  workflow_dispatch: # Allow manual triggering

jobs:
  test:
    name: Playwright Tests
    timeout-minutes: 60
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps

    - name: Start PWA Server
      run: |
        cd pwa
        Start-Process powershell -ArgumentList "-Command", "npx serve . -l 3000" -WindowStyle Hidden
        Start-Sleep -Seconds 5
      shell: pwsh

    - name: Run Playwright tests
      run: npm test
      env:
        PWA_URL: http://localhost:3000

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload test screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-screenshots
        path: test-results/
        retention-days: 7

  test-mobile:
    name: Mobile Playwright Tests
    timeout-minutes: 60
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps

    - name: Start PWA Server
      run: |
        cd web-app
        Start-Process powershell -ArgumentList "-Command", "npx serve . -l 3000" -WindowStyle Hidden
        Start-Sleep -Seconds 5
      shell: pwsh

    - name: Run Mobile Tests
      run: npx playwright test --project="Mobile Chrome"
      env:
        PWA_URL: http://localhost:3000

    - name: Upload mobile test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mobile-playwright-report
        path: playwright-report/
        retention-days: 30
