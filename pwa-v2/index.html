<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0078d4">
    <meta name="description" content="Voice Assistant for Business Central">
    <title>BC Voice Assistant v2.2.13</title>
    <meta name="version" content="2.2.13">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>🎤 BC Voice Assistant <span style="font-size:0.7em;color:#fff;background:#0078d4;padding:2px 8px;border-radius:8px;margin-left:8px;">v2.2.13</span></h1>
            <button id="settingsBtn" class="settings-btn" aria-label="Settings">⚙️</button>
        </header>

        <!-- Debug Panel for TTS Troubleshooting -->
        <div id="debugPanel" class="debug-panel hidden" style="background:#000;color:#0f0;padding:12px;font-family:monospace;font-size:11px;max-height:300px;overflow-y:auto;border:2px solid #0f0;position:fixed;bottom:80px;left:10px;right:10px;z-index:999;border-radius:4px;box-shadow:0 0 10px rgba(0,255,0,0.3);">
            <div style="margin-bottom:8px;border-bottom:1px solid #0f0;padding-bottom:4px;">
                <strong>🔍 TTS Debug Console</strong>
                <button id="closeDebugBtn" style="float:right;background:none;border:none;color:#0f0;cursor:pointer;">✕</button>
            </div>
            <div id="voiceInfo" style="margin-bottom:8px;padding:4px;background:#111;"></div>
            <div id="ttsLog" style="margin-top:8px;max-height:200px;overflow-y:auto;"></div>
        </div>

        <!-- Settings Panel -->
        <div id="settingsPanel" class="settings-panel hidden">
            <h2>Connection Settings</h2>
            <div class="form-group">
                <label for="relayUrl">Relay Function URL</label>
                <input type="url" id="relayUrl" placeholder="https://func-bcvoice-v2.azurewebsites.net/api/voicerelay">
            </div>
            <div class="button-group">
                <button id="saveSettingsBtn" class="btn btn-primary">Save</button>
                <button id="cancelSettingsBtn" class="btn btn-secondary">Cancel</button>
            </div>
            <div id="settingsStatus" class="settings-status"></div>
        </div>

        <!-- Status indicator with Debug button for iOS only -->
        <div style="position:relative;">
            <button id="debugBtn" class="settings-btn" style="position:absolute;right:10px;top:-40px;font-size:20px;background:none;border:none;cursor:pointer;display:none;" aria-label="Debug">🔍</button>
        </div>

        <!-- Status indicator -->
        <div id="status" class="status-indicator">
            <span class="status-dot"></span>
            <span class="status-text">Tap microphone to start</span>
        </div>

        <!-- Conversation -->
        <main id="conversation" class="conversation">
            <div class="msg system">
                <p>Welcome! Tap the microphone or type a question about your Business Central data.</p>
                <p class="hint">Try: "How many customers do we have?" or "Show me top 5 sales orders"</p>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="footer">
            <div class="input-row">
                <input type="text" id="textInput" placeholder="Type a question..." autocomplete="off">
                <button id="sendBtn" class="icon-btn send-btn" aria-label="Send" title="Send">➤</button>
                <button id="micBtn" class="mic-btn" aria-label="Record" title="Record">🎤</button>
            </div>
        </footer>

        <!-- Recording Overlay -->
        <div id="recordingOverlay" class="recording-overlay hidden">
            <div class="pulse"></div>
            <span>Recording...</span>
            <button id="stopBtn" class="btn btn-danger">Stop</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
